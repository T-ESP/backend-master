services:
  db:
    networks:
      - monitoring_net

  migrate:
    networks:
      - monitoring_net

  seed:
    networks:
      - monitoring_net

  web:
    networks:
      - monitoring_net
    labels:
      - "traefik.enable=true"

      # API classique
      - "traefik.http.routers.api.rule=Host(`api.stock-s.fr`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls.certresolver=myresolver"
      - "traefik.http.routers.api.service=backend"
      # Service unique backend
      - "traefik.http.services.backend.loadbalancer.server.port=8080"



networks:
  monitoring_net:
    external: true

###############################################################################
