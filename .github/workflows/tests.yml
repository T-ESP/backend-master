name: Deploy Backend

on:
  push:
    branches: [ main ]

jobs:
  test:
    name: Test Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout backend repo
        uses: actions/checkout@v4

      - name: Validate docker compose
        run: docker compose config
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          # `docker compose config` ne fait qu'interpoler les variables : une
          # valeur factice suffit pour valider (le service IA n'est pas démarré).
          GROQ_API_KEY: ci-dummy-key

      - name: Build backend image
        run: docker build -t backend-master-ci .

  deploy:
    name: Deploy Backend (PROD)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout backend repo
        uses: actions/checkout@v4

      - name: Checkout devops repo
        uses: actions/checkout@v4
        with:
          repository: T-ESP/devops
          token: ${{ secrets.GH_TOKEN }}
          path: devops

      - name: Install Ansible
        run: |
          sudo apt update -y
          sudo apt install -y ansible python3-pip

      - name: Install Ansible docker collection
        run: ansible-galaxy collection install community.docker

      - name: Setup SSH private key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 162.19.242.23 >> ~/.ssh/known_hosts

      - name: Deploy Backend with Ansible
        working-directory: devops
        run: |
          ansible-playbook -i inventory.ini deploy-backend-master.yml \
            -e "gh_token=${{ secrets.GH_TOKEN }}" \
            -e "postgres_password=$POSTGRES_PASSWORD"
        env:
          ANSIBLE_HOST_KEY_CHECKING: False
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
#################
