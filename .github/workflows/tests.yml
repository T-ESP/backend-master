name: CI / Deploy Backend

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: true

jobs:

  test:
    name: Run Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout backend repo
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend_master/stocks_api_master/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('backend_master/stocks_api_master/Cargo.lock') }}

      - name: Run tests
        working-directory: backend_master/stocks_api_master
        run: cargo test --all

  deploy:
    name: Deploy Backend (PROD)
    needs: test
    runs-on: ubuntu-latest

    # IMPORTANT : pas besoin du if ici
    # car le workflow ne se déclenche que sur main

    steps:
      - name: Checkout backend repo
        uses: actions/checkout@v4

      - name: Checkout devops repo
        uses: actions/checkout@v4
        with:
          repository: T-ESP/devops
          token: ${{ secrets.GH_TOKEN }}
          path: devops

      - name: Install Ansible
        run: |
          sudo apt update -y
          sudo apt install -y ansible python3-pip

      - name: Install Ansible docker collection
        run: ansible-galaxy collection install community.docker

      - name: Setup SSH private key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 162.19.242.23 >> ~/.ssh/known_hosts

      - name: Deploy Backend with Ansible
        working-directory: devops
        run: |
          ansible-playbook -i inventory.ini deploy-backend-master.yml \
            -e "gh_token=${{ secrets.GH_TOKEN }}"
        env:
          ANSIBLE_HOST_KEY_CHECKING: False
