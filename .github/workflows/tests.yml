name: Tests

on:
  push:
    branches: [ main, dev, product_status ]
  pull_request:
    branches: [ main, dev ]

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: true

jobs:
  test:
    name: Run All Tests
    runs-on: ubuntu-latest

    steps:
    # ============================================
    # SETUP COMMUN (une seule fois)
    # ============================================
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo registry
      uses: actions/cache@v3
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo index
      uses: actions/cache@v3
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo build
      uses: actions/cache@v3
      with:
        path: stocks_api/target
        key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}

    # ============================================
    # TESTS MODULAIRES (séquentiels mais rapides)
    # ============================================
    - name: "Products Tests (32 tests)"
      working-directory: ./stocks_api
      run: |
        echo "=========================================="
        echo "Testing Products Module"
        echo "=========================================="
        if cargo test --lib features::products; then
          echo "Products: 32 tests passed"
        else
          echo "Products: tests FAILED"
          exit 1
        fi
        echo ""

    - name: "Orders Tests (16 tests)"
      working-directory: ./stocks_api
      run: |
        echo "=========================================="
        echo "Testing Orders Module"
        echo "=========================================="
        if cargo test --lib features::orders; then
          echo "Orders: 16 tests passed"
        else
          echo "Orders: tests FAILED"
          exit 1
        fi
        echo ""

    - name: "Users Tests (7 tests)"
      working-directory: ./stocks_api
      run: |
        echo "=========================================="
        echo "Testing Users Module"
        echo "=========================================="
        if cargo test --lib features::users; then
          echo "Users: 7 tests passed"
        else
          echo "Users: tests FAILED"
          exit 1
        fi
        echo ""

    - name: "Stocks Tests (13 tests)"
      working-directory: ./stocks_api
      run: |
        echo "=========================================="
        echo "Testing Stocks Module"
        echo "=========================================="
        if cargo test --lib features::stocks; then
          echo "Stocks: 13 tests passed"
        else
          echo "Stocks: tests FAILED"
          exit 1
        fi
        echo ""

    - name: "Suppliers Tests (10 tests)"
      working-directory: ./stocks_api
      run: |
        echo "=========================================="
        echo "Testing Suppliers Module"
        echo "=========================================="
        if cargo test --lib features::suppliers; then
          echo "Suppliers: 10 tests passed"
        else
          echo "Suppliers: tests FAILED"
          exit 1
        fi
        echo ""

    # ============================================
    # TEST COMPLET (vérification d'intégration)
    # ============================================
    - name: "Integration Tests (all modules)"
      working-directory: ./stocks_api
      run: |
        echo "=========================================="
        echo "Running All Unit Tests"
        echo "=========================================="
        if cargo test --lib; then
          echo "All tests: 78 tests passed"
        else
          echo "All tests: FAILED"
          exit 1
        fi
        echo ""

    # ============================================
    # SUMMARY (toujours exécuté)
    # ============================================
    - name: "Test Summary"
      if: always()
      working-directory: ./stocks_api
      run: |
        echo "=========================================="
        echo "Test Summary"
        echo "=========================================="
        echo ""

        if [ "${{ job.status }}" == "success" ]; then
          echo "Module breakdown:"
          echo "  Products: 32 tests"
          echo "  Orders: 16 tests"
          echo "  Users: 7 tests"
          echo "  Stocks: 13 tests"
          echo "  Suppliers: 10 tests"
          echo ""
          echo "=========================================="
          echo "  Total: 78 tests passed"
          echo "=========================================="
        else
          echo "Some tests failed. Check the logs above for details."
          echo ""
          echo "Module breakdown:"
          echo "  Products: 32 tests"
          echo "  Orders: 16 tests"
          echo "  Users: 7 tests"
          echo "  Stocks: 13 tests"
          echo "  Suppliers: 10 tests"
          echo ""
          echo "=========================================="
          echo "  Tests suite FAILED"
          echo "=========================================="
        fi
  deploy:
    name: Deploy Backend
    needs: test
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout backend repo
        uses: actions/checkout@v4

      - name: Checkout devops repo
        uses: actions/checkout@v4
        with:
          repository: T-ESP/devops
          token: ${{ secrets.GH_TOKEN }}
          path: devops

      - name: Install Ansible and dependencies
        run: |
          sudo apt update -y
          sudo apt install -y ansible python3-pip

      - name: Install Ansible docker collection
        run: |
          ansible-galaxy collection install community.docker

      - name: Setup SSH private key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 162.19.242.23 >> ~/.ssh/known_hosts

      - name: Deploy Backend with Ansible
        working-directory: devops
        run: |
          ansible-playbook -i inventory.ini deploy-backend.yml \
            -e "gh_token=${{ secrets.GH_TOKEN }}"
        env:
          ANSIBLE_HOST_KEY_CHECKING: False

