name: Tests

on:
  push:
    branches: [ main, dev, product_status ]
  pull_request:
    branches: [ main, dev ]

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: true

jobs:
  deploy:
    name: Deploy Backend
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev'

    steps:
      - name: Checkout backend repo
        uses: actions/checkout@v4

      - name: Checkout devops repo
        uses: actions/checkout@v4
        with:
          repository: T-ESP/devops
          token: ${{ secrets.GH_TOKEN }}
          path: devops

      - name: Install Ansible and dependencies
        run: |
          sudo apt update -y
          sudo apt install -y ansible python3-pip

      - name: Install Ansible docker collection
        run: |
          ansible-galaxy collection install community.docker

      - name: Setup SSH private key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 162.19.242.23 >> ~/.ssh/known_hosts

      - name: Deploy Backend with Ansible
        working-directory: devops
        run: |
          ansible-playbook -i inventory.ini deploy-backend-master.yml \
            -e "gh_token=${{ secrets.GH_TOKEN }}"
        env:
          ANSIBLE_HOST_KEY_CHECKING: False

