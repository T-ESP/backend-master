services:
  db:
    networks:
      - monitoring_net

  migrate:
    networks:
      - monitoring_net

  web:
    networks:
      - monitoring_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.stock-s.fr`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls.certresolver=myresolver"
      - "traefik.http.services.api.loadbalancer.server.port=8080"

      - "traefik.http.routers.tenant.rule=HostRegexp(`{tenant:[a-z0-9-]+}.stock-s.fr`)"
      - "traefik.http.routers.tenant.entrypoints=websecure"
      - "traefik.http.routers.tenant.tls.certresolver=myresolver"
      - "traefik.http.routers.tenant.service=api"

networks:
  monitoring_net:
    external: true
