services:
  db:
    networks:
      - monitoring_net

  migrate:
    networks:
      - monitoring_net

  web:
    networks:
      - monitoring_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend-master-api.rule=Host(`api.stock-s.fr`)"
      - "traefik.http.routers.backend-master-api.entrypoints=websecure"
      - "traefik.http.routers.backend-master-api.tls.certresolver=myresolver"
      - "traefik.http.routers.backend-master-api.service=backend-master-svc"
      - "traefik.http.services.backend-master-svc.loadbalancer.server.port=8080"

networks:
  monitoring_net:
    external: true
