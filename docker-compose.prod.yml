services:
  db:
    networks:
      - monitoring_net

  migrate:
    networks:
      - monitoring_net

  web:
    networks:
      - monitoring_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend-master-api.rule=Host(`api.stock-s.fr`)"
      - "traefik.http.routers.backend-master-api.entrypoints=websecure"
      - "traefik.http.routers.backend-master-api.tls.certresolver=myresolver"
      - "traefik.http.routers.backend-master-api.service=backend-master-svc"
      - "traefik.http.services.backend-master-svc.loadbalancer.server.port=8080"

  # ai-service is defined in the base compose; in prod it just needs to join the
  # shared network so `web` can reach it at http://ai-service:8001 and it can
  # reach the db. (No traefik route — it's internal-only.)))
  ai-service:
    networks:
      - monitoring_net

  pgadmin:
    ports:
      - "127.0.0.1:5052:80"

networks:
  monitoring_net:
    external: true
