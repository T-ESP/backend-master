services:
  db:
    # pgvector image so the master DB + every tenant DB can `CREATE EXTENSION vector`
    # (required by the chatbot RAG corpus + response cache).
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: stocks_master
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d stocks_master"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build: .
    depends_on:
      db:
        condition: service_healthy
    working_dir: /app
    command: /app/migrate
    environment:
      DATABASE_URL: postgres://user:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/stocks_master
    restart: "no"

  seed:
    image: python:3.12-slim
    depends_on:
      migrate:
        condition: service_completed_successfully
    working_dir: /app
    entrypoint: ["sh", "-c", "pip install --no-cache-dir -r requirements.txt && python seed.py"]
    volumes:
      - ./scripts:/app
      - ./seeds:/app/seeds
    environment:
      DATABASE_URL: postgres://user:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/stocks_master
    restart: "no"

  web:
    build: .
    depends_on:
      migrate:
        condition: service_completed_successfully
    working_dir: /app
    command: /app/server
    environment:
      DATABASE_URL: postgres://user:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/stocks_master
      JWT_SECRET: zf2nrOa8bEZ4QH1wioy5N0VJj9sevIG3BApqCSKTDgmRYldh7F6UuMPxLXtkWc
      # Where the chat gateway proxies LLM turns.
      AI_SERVICE_URL: http://ai-service:8001
      # Email du ticket de caisse via SendGrid (même fournisseur que les rapports).
      # Renseigner SENDGRID_API_KEY dans .env pour activer l'envoi réel.
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      TICKET_FROM_EMAIL: ${TICKET_FROM_EMAIL:-caisse@stock-s.fr}
    ports:
      - "8092:8080"
    restart: unless-stopped

  # Python AI service: ML batch jobs (Prophet, anomalies, ...) + the chatbot
  # engine (LLM / RAG / tools). Connects to the master DB for the shared RAG
  # corpus; chat conversations live in the per-tenant DBs (written by the Rust
  # gateway). Verify-profile flags keep startup light (no model downloads).
  ai-service:
    build: ./backend-dev/ai-service
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://user:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/stocks_master
      STOCKS_API_URL: http://web:8080
      AI_SERVICE_PORT: "8001"
      # LLM providers: Groq (primary, Llama-3.3-70B) + Mistral (auto-fallback).
      LLM_PROVIDER: "groq"
      GROQ_API_KEY: ${GROQ_API_KEY:?GROQ_API_KEY is required}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      # RAG: index the shared corpus into the master DB on startup.
      EMBED_MODEL: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
      RAG_CORPUS_PATHS: "/app/corpus"
      RAG_INDEX_ON_STARTUP: "true"
      # Cache disabled to keep tenant isolation (shared cache would leak answers).
      CHAT_RESPONSE_CACHE: "false"
      # ML batch cron stays off here (per-tenant ML is a separate follow-up).
      RUN_ON_STARTUP: "false"
      CHAT_DEFAULT_LANG: "fr"
    ports:
      - "8001:8001"
    volumes:
      - ai_models:/app/saved_models
      - embed_cache:/app/embed_cache
      - ./docs:/app/corpus/docs:ro
      - ./guide_bdd_migrations.md:/app/corpus/guide_bdd_migrations.md:ro
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:8
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5051:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  db_data:
  pgadmin_data:
  ai_models:
  embed_cache:
